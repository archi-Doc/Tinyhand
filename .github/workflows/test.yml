name: Build and Test

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --no-restore --verbosity normal
    - name: Run external registration checks
      run: dotnet run --project ExternalRegistrationTest/ExternalRegistrationTest.csproj -p:PublishAot=false

  native-aot:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          rid: linux-x64
        - os: windows-latest
          rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install native compiler
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: Publish serializer checks
      run: dotnet publish NativeAotTest/NativeAotTest.csproj -c Release -r ${{ matrix.rid }} -o artifacts/aot
    - name: Publish processor checks
      run: dotnet publish NativeAotProcessorTest/NativeAotProcessorTest.csproj -c Release -r ${{ matrix.rid }} -o artifacts/processor-aot
    - name: Publish external registration checks
      run: dotnet publish ExternalRegistrationTest/ExternalRegistrationTest.csproj -c Release -r ${{ matrix.rid }} -o artifacts/external-aot
    - name: Run native checks (Linux)
      if: runner.os == 'Linux'
      run: |
        ./artifacts/aot/NativeAotTest
        ./artifacts/processor-aot/NativeAotProcessorTest
        ./artifacts/external-aot/ExternalRegistrationTest --require-native
    - name: Run native checks (Windows)
      if: runner.os == 'Windows'
      run: |
        & ./artifacts/aot/NativeAotTest.exe
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & ./artifacts/processor-aot/NativeAotProcessorTest.exe
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & ./artifacts/external-aot/ExternalRegistrationTest.exe --require-native
        exit $LASTEXITCODE
